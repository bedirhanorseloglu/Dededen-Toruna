<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mutfak KDS Panosu • Dededen Toruna Hamsiköy Sütlacı</title>
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="animations.css">
    <script src="libs/gsap.min.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="brand-section">
            <img src="logo.png" alt="Dededen Toruna" class="brand-logo-img">
            <div class="brand-text">
                <h1>Mutfak KDS Panosu</h1>
                <p>Canlı Sipariş & Hazırlık İstasyonu</p>
            </div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
            <button class="btn-outline" id="btn-sound-toggle" style="padding: 7px 14px; font-size: 12px; color: var(--brand-gold); border-color: var(--brand-gold); display: flex; align-items: center; gap: 6px; cursor: pointer; border-radius: var(--radius-md);">
                <span id="sound-indicator-dot" style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #10b981;"></span>
                <span id="sound-btn-text">Sesli Uyarı: Açık</span>
            </button>
            <div class="user-badge" style="padding: 6px 12px;">
                <span class="user-role-tag" style="background: var(--brand-primary); font-weight: 800;">MUTFAK</span>
                <strong id="user-name-display">Mutfak Ekibi</strong>
            </div>
            <button class="btn-logout" title="Çıkış Yap" id="btn-logout">✕</button>
        </div>
    </header>

    <div class="kitchen-board-container">
        <!-- Modern KDS Bilgi & Hızlı Kontrol Çubuğu -->
        <div class="kds-top-bar">
            <div class="kds-metrics">
                <div class="kds-stat-pill active-orders">
                    <span>⏱️</span>
                    <span id="kds-stat-tables">0 Masa Hazırlanıyor</span>
                </div>
                <div class="kds-stat-pill items-count">
                    <span>🍽️</span>
                    <span id="kds-stat-items">0 Kalem Bekliyor</span>
                </div>
            </div>

            <!-- Hızlı Filtre Sekmeleri -->
            <div class="kds-filter-tabs">
                <button class="kds-tab-btn active" id="tab-kds-all" onclick="setKdsFilter('all')">
                    Tümü <span id="filter-badge-all" style="opacity: 0.8;">(0)</span>
                </button>
                <button class="kds-tab-btn" id="tab-kds-pending" onclick="setKdsFilter('pending')">
                    🟡 Hazırlananlar <span id="filter-badge-pending" style="opacity: 0.8;">(0)</span>
                </button>
                <button class="kds-tab-btn" id="tab-kds-ready" onclick="setKdsFilter('ready')">
                    🟢 Servise Hazır <span id="filter-badge-ready" style="opacity: 0.8;">(0)</span>
                </button>
            </div>

            <!-- Canlı Mutfak Saati -->
            <div class="kds-clock" id="kds-live-clock">
                --:--:--
            </div>
        </div>

        <main class="kitchen-board" id="kitchen-container">
            <!-- Canlı Mutfak Kartları -->
        </main>
    </div>

    <script type="module">
        import { 
            checkAuth, 
            clearActiveUser, 
            onOrderChange, 
            broadcastOrderChange, 
            initAudio, 
            playNotificationSound, 
            announceNewOrder,
            showSystemNotification,
            flashTabTitle,
            db, 
            collection, 
            doc, 
            getDocs,
            updateDoc, 
            onSnapshot, 
            query, 
            where 
        } from "./core.js?v=2.5";
        import { showToast, pageNavigate, animateCardEntrance, animateCardExit } from "./motion.js";
        import { updateKitchenStats } from "./analytics-service.js";

        const user = checkAuth('kitchen');
        if (user) document.getElementById('user-name-display').textContent = user.name;
        document.getElementById('btn-logout').onclick = () => {
            clearActiveUser();
            pageNavigate('index.html');
        };

        // Canlı Mutfak Saati
        function updateClock() {
            const clockEl = document.getElementById('kds-live-clock');
            if (clockEl) {
                const now = new Date();
                clockEl.textContent = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            }
        }
        updateClock();
        setInterval(updateClock, 1000);

        let soundEnabled = true;
        const soundBtn = document.getElementById('btn-sound-toggle');
        soundBtn.onclick = () => {
            soundEnabled = !soundEnabled;
            const dot = document.getElementById('sound-indicator-dot');
            const txt = document.getElementById('sound-btn-text');
            if (dot) dot.style.background = soundEnabled ? '#10b981' : '#ef4444';
            if (txt) txt.textContent = soundEnabled ? 'Sesli Uyarı: Açık' : 'Sesli Uyarı: Kapalı';
            if (soundEnabled) {
                initAudio();
                playNotificationSound();
                speakAnnouncement("Mutfak sesli bildirimleri açık");
                showToast("Sesli Uyarı ve Anons Açıldı 🔔", "success");
            } else {
                showToast("Sesli Uyarı Kapatıldı 🔇", "info");
            }
        };

        const unlockMobileAudio = () => {
            initAudio();
            if ('speechSynthesis' in window && window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
            }
            window.removeEventListener('click', unlockMobileAudio);
            window.removeEventListener('touchstart', unlockMobileAudio);
        };
        window.addEventListener('click', unlockMobileAudio, { passive: true });
        window.addEventListener('touchstart', unlockMobileAudio, { passive: true });

        let currentFilter = 'all'; // 'all' | 'pending' | 'ready'
        window.setKdsFilter = (filter) => {
            currentFilter = filter;
            document.querySelectorAll('.kds-tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-kds-${filter}`)?.classList.add('active');
            renderKitchen();
        };

        function formatElapsedTime(isoString) {
            if (!isoString) return 'Yeni';
            const diffMs = Date.now() - new Date(isoString).getTime();
            const diffMins = Math.floor(diffMs / 60000);
            if (diffMins < 1) return 'Yeni sipariş';
            if (diffMins < 60) return `${diffMins} dk önce`;
            const diffHours = Math.floor(diffMins / 60);
            return `${diffHours} sa ${diffMins % 60} dk`;
        }

        let activeOrders = JSON.parse(localStorage.getItem('cafe_cached_orders') || '{}');
        let initialRenderDone = false;

        function renderKitchen() {
            const container = document.getElementById('kitchen-container');
            
            // Tüm aktif mutfak siparişleri
            const allOrders = Object.values(activeOrders)
                .filter(o => o.status === 'open' && o.items?.length > 0 && (o.kitchen_status !== 'completed' || o.items.some(i => i.status !== 'delivered')))
                .sort((a,b) => new Date(a.updated_at || 0) - new Date(b.updated_at || 0));

            // Metrikler
            const totalOrdersCount = allOrders.length;
            let pendingItemsCount = 0;
            let readyOrdersCount = 0;
            let pendingOrdersCount = 0;

            allOrders.forEach(o => {
                const isAllReady = o.items.every(i => i.status === 'delivered');
                if (isAllReady) readyOrdersCount++;
                else pendingOrdersCount++;

                o.items.forEach(i => {
                    if (i.status !== 'delivered') pendingItemsCount += (Number(i.quantity) || 1);
                });
            });

            // Metrikleri üst bara yaz
            const statTablesEl = document.getElementById('kds-stat-tables');
            const statItemsEl = document.getElementById('kds-stat-items');
            if (statTablesEl) statTablesEl.textContent = `${totalOrdersCount} Masa Hazırlanıyor`;
            if (statItemsEl) statItemsEl.textContent = `${pendingItemsCount} Kalem Bekliyor`;

            document.getElementById('filter-badge-all').textContent = `(${totalOrdersCount})`;
            document.getElementById('filter-badge-pending').textContent = `(${pendingOrdersCount})`;
            document.getElementById('filter-badge-ready').textContent = `(${readyOrdersCount})`;

            // Filtreleme uygula
            const filteredOrders = allOrders.filter(order => {
                const isAllReady = order.items.every(i => i.status === 'delivered');
                if (currentFilter === 'pending') return !isAllReady;
                if (currentFilter === 'ready') return isAllReady;
                return true; // 'all'
            });

            if (filteredOrders.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 80px 20px; background: var(--bg-surface); border: 1px dashed var(--border-card); border-radius: var(--radius-lg);">
                        <div style="font-size: 54px; margin-bottom: 12px;">👨‍🍳✨</div>
                        <h3 style="font-size: 20px; font-weight: 800; color: white;">
                            ${currentFilter === 'ready' ? 'Hazır bekleyen masa bulunmuyor' : (currentFilter === 'pending' ? 'Tüm siparişler hazırlandı!' : 'Mutfak Tertemiz!')}
                        </h3>
                        <p style="font-size: 13px; color: var(--text-muted); margin-top: 6px;">
                            ${currentFilter === 'all' ? 'Şu anda hazırlanması gereken yeni bir sipariş bulunmuyor.' : 'Diğer sekmelerden sipariş durumlarını görebilirsiniz.'}
                        </p>
                    </div>
                `;
                initialRenderDone = true;
                return;
            }

            container.innerHTML = filteredOrders.map(order => {
                const allDelivered = order.items?.every(i => i.status === 'delivered');
                const orderKey = order.id || order.table_no;
                const elapsedText = formatElapsedTime(order.updated_at || order.created_at);

                // Masada önceden teslim edilmiş ürünler ve yeni bekleyen ürünler ayrımı
                const deliveredItems = (order.items || []).filter(i => i.status === 'delivered');
                const pendingItems = (order.items || []).map((item, idx) => ({ ...item, realIdx: idx })).filter(i => i.status !== 'delivered');
                const isAdditionalOrder = deliveredItems.length > 0 && pendingItems.length > 0;

                // Kullanıcının Talebi: "Sadece ek gelen sipariş gözükmeli, eski teslim edilmiş ürünler mutfağın önünü kapatmamalı"
                const displayItems = allDelivered ? (order.items || []).map((item, idx) => ({ ...item, realIdx: idx })) : pendingItems;

                const itemsRows = displayItems.map((item) => {
                    const idx = item.realIdx;
                    const isDelivered = item.status === 'delivered';
                    return `
                        <div class="kds-item-row ${isDelivered ? 'is-done' : ''}">
                            <div class="kds-item-left">
                                <span class="kds-qty">${item.quantity}x</span>
                                <div class="kds-name-box">
                                    <div class="kds-name">${item.name}</div>
                                    ${item.note ? `
                                        <div class="kds-note">
                                            <span>📝</span>
                                            <span>${item.note}</span>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                            <button class="kds-check-btn" onclick="toggleDelivered('${orderKey}', ${idx})" title="${isDelivered ? 'Geri Al' : 'Hazırlandı Olarak İşaretle'}">
                                ${isDelivered ? '✓ Hazır' : 'Hazırla ○'}
                            </button>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="kitchen-card ${allDelivered ? 'all-done' : ''}" id="kitchen-card-${orderKey}">
                        <div class="kds-card-header">
                            <div>
                                <div class="kds-table-badge">Masa ${order.table_no}</div>
                                <div class="kds-waiter-info">Garson: <strong>${order.waiter_name || 'Personel'}</strong></div>
                            </div>
                            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
                                ${allDelivered ? `
                                    <span class="kds-status-pill ready">✓ Servise Hazır</span>
                                ` : (isAdditionalOrder ? `
                                    <span class="kds-status-pill" style="background: rgba(245, 159, 0, 0.2); color: #f59f00; border: 1px solid rgba(245, 159, 0, 0.5); font-weight: 800;">🆕 EK SİPARİŞ (${pendingItems.length} Kalem)</span>
                                    <span style="font-size: 11px; color: var(--text-muted);">⏱️ ${elapsedText}</span>
                                ` : `
                                    <span class="kds-status-pill preparing">⏱️ ${elapsedText}</span>
                                `)}
                            </div>
                        </div>

                        <div class="kds-card-items">
                            ${itemsRows}
                        </div>
                        
                        ${isAdditionalOrder ? `
                            <div style="margin-top: 8px; padding: 6px 10px; background: rgba(16, 185, 129, 0.08); border: 1px dashed rgba(16, 185, 129, 0.3); border-radius: var(--radius-sm); font-size: 11px; color: #10b981; display: flex; align-items: center; justify-content: space-between;">
                                <span>✓ Önceki teslimat: ${deliveredItems.length} kalem</span>
                                <span style="color: var(--text-muted); font-size: 10px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${deliveredItems.map(d => `${d.quantity}x ${d.name}`).join(', ')}</span>
                            </div>
                        ` : ''}

                        <div class="kds-card-footer">
                            ${allDelivered ? `
                                <button class="kds-btn-dismiss" onclick="dismissOrderFromKitchen('${orderKey}')">
                                    🚀 Garsona Teslim Edildi (Kaldır)
                                </button>
                            ` : `
                                <button class="kds-btn-deliver-all" onclick="deliverAll('${orderKey}')">
                                    ${isAdditionalOrder ? '✓ Ek Siparişi Tamamla (Garsona Bildir)' : '✓ Masayı Tamamla (Garsona Bildir)'}
                                </button>
                            `}
                        </div>
                    </div>
                `;
            }).join('');

            if (!initialRenderDone) {
                initialRenderDone = true;
                setTimeout(() => animateCardEntrance('.kitchen-card'), 50);
            }
        }

        window.toggleDelivered = async (orderId, idx) => {
            const order = Object.values(activeOrders).find(o => (o.id === orderId) || (String(o.table_no) === String(orderId)));
            if (!order) return;

            order.items[idx].status = order.items[idx].status === 'delivered' ? 'pending' : 'delivered';
            const allDelivered = order.items.every(i => i.status === 'delivered');
            order.all_delivered = allDelivered;
            const nowTime = Date.now();
            if (allDelivered) {
                order.kitchen_status = 'completed';
                order.kitchen_notified_at = nowTime;
            } else {
                order.kitchen_status = 'pending';
            }
            
            localStorage.setItem('cafe_cached_orders', JSON.stringify(activeOrders));
            if (allDelivered) {
                broadcastOrderChange('all_delivered', { 
                    orderId, 
                    table_no: order.table_no,
                    waiter_id: order.waiter_id,
                    waiter_name: order.waiter_name,
                    kitchen_notified_at: nowTime
                });
                showToast(`Masa ${order.table_no} tüm ürünleri hazır! (${order.waiter_name || 'Garson'} bilgilendirildi)`, "success");
            } else {
                broadcastOrderChange('item_delivered', { orderId, idx, table_no: order.table_no });
            }
            renderKitchen();

            try {
                const docIdToUpdate = order.firestore_id || order.doc_id || (order.id && !order.id.startsWith("order-") ? order.id : null);
                const updatePayload = { 
                    items: order.items,
                    all_delivered: allDelivered,
                    kitchen_status: allDelivered ? 'completed' : 'pending',
                    kitchen_notified_at: allDelivered ? nowTime : null
                };

                if (docIdToUpdate) {
                    await updateDoc(doc(db, "orders", docIdToUpdate), updatePayload);
                } else {
                    const qOrder = query(collection(db, "orders"), where("table_no", "==", Number(order.table_no)), where("status", "==", "open"));
                    const snap = await getDocs(qOrder);
                    if (!snap.empty) {
                        for (const d of snap.docs) {
                            await updateDoc(doc(db, "orders", d.id), updatePayload);
                        }
                    }
                }
            } catch(e) {
                console.error("Firestore toggleDelivered error:", e);
            }
        };

        window.deliverAll = async (orderId) => {
            const order = Object.values(activeOrders).find(o => (o.id === orderId) || (String(o.table_no) === String(orderId)));
            if (!order) return;

            const nowIso = new Date().toISOString();
            const nowTime = Date.now();
            const queuedAt = new Date(order.kitchen_queued_at || order.order_taken_at || order.updated_at || Date.now()).getTime();
            const prepSecs = Math.max(60, Math.round((Date.now() - queuedAt) / 1000));

            order.items.forEach(i => i.status = 'delivered');
            order.all_delivered = true;
            order.kitchen_status = 'completed';
            order.delivered_at = nowIso;
            order.kitchen_delivered_at = nowIso;
            order.kitchen_notified_at = nowTime;
            order.kitchen_staff_id = user?.id || 'ktc-1';
            order.kitchen_staff_name = user?.name || 'Fadime';
            order.prep_duration_seconds = prepSecs;

            // Mutfak personeli istatistiğini artır
            updateKitchenStats(order.kitchen_staff_id, prepSecs, order.items.length);

            const cardEl = document.getElementById(`kitchen-card-${orderId}`);
            const completeDelivery = async () => {
                localStorage.setItem('cafe_cached_orders', JSON.stringify(activeOrders));
                broadcastOrderChange('all_delivered', { 
                    orderId, 
                    table_no: order.table_no,
                    waiter_id: order.waiter_id,
                    waiter_name: order.waiter_name,
                    kitchen_notified_at: nowTime
                });
                showToast(`Masa ${order.table_no} tüm ürünleri hazır! ${order.waiter_name ? `(${order.waiter_name} bilgilendirildi)` : ''}`, "success");
                renderKitchen();

                try {
                    const docIdToUpdate = order.firestore_id || order.doc_id || (order.id && !order.id.startsWith("order-") ? order.id : null);
                    const updatePayload = { 
                        items: order.items,
                        all_delivered: true,
                        kitchen_status: 'completed',
                        delivered_at: order.delivered_at,
                        kitchen_delivered_at: order.kitchen_delivered_at,
                        kitchen_notified_at: nowTime,
                        kitchen_staff_id: order.kitchen_staff_id,
                        kitchen_staff_name: order.kitchen_staff_name
                    };

                    if (docIdToUpdate) {
                        await updateDoc(doc(db, "orders", docIdToUpdate), updatePayload);
                    } else {
                        const qOrder = query(collection(db, "orders"), where("table_no", "==", Number(order.table_no)), where("status", "==", "open"));
                        const snap = await getDocs(qOrder);
                        if (!snap.empty) {
                            for (const d of snap.docs) {
                                await updateDoc(doc(db, "orders", d.id), updatePayload);
                            }
                        }
                    }
                } catch(e) {
                    console.error("Firestore teslimat güncelleme hatası:", e);
                }
            };

            if (cardEl) {
                animateCardExit(cardEl, completeDelivery);
            } else {
                completeDelivery();
            }
        };

        window.dismissOrderFromKitchen = async (orderId) => {
            const order = Object.values(activeOrders).find(o => (o.id === orderId) || (String(o.table_no) === String(orderId)));
            if (!order) return;

            const cardEl = document.getElementById(`kitchen-card-${orderId}`);
            const doDismiss = async () => {
                order.kitchen_status = 'completed';
                localStorage.setItem('cafe_cached_orders', JSON.stringify(activeOrders));
                broadcastOrderChange('order_dismissed', { orderId });
                showToast(`Masa ${order.table_no} ekrandan kaldırıldı`, "info");
                renderKitchen();

                try {
                    if (order.id && !order.id.startsWith("order-")) {
                        await updateDoc(doc(db, "orders", order.id), { kitchen_status: 'completed' });
                    }
                } catch(e) {}
            };

            if (cardEl) {
                animateCardExit(cardEl, doDismiss);
            } else {
                doDismiss();
            }
        };

        // Yeni sipariş gelince ses çal & Türkçe sesli oku & bildirim ver
        onOrderChange((ev) => {
            activeOrders = JSON.parse(localStorage.getItem('cafe_cached_orders') || '{}');
            if (ev?.type === 'order_saved') {
                const hasPending = ev.data?.items?.some(i => i.status !== 'delivered');
                const isCompleted = ev.data?.kitchen_status === 'completed';
                if (hasPending && !isCompleted) {
                    if (soundEnabled) {
                        playNotificationSound();
                        announceNewOrder(ev.data?.table_no, ev.data?.items);
                    }
                    showToast(`🔔 Yeni Sipariş: Masa ${ev.data?.table_no}`, "warning");
                }
            }
            renderKitchen();
        });

        // Mutfakta sesli anons SADECE garson mutfağa YENİ bir sipariş gönderdiğinde çalar.
        let isFirstKitchenSnapshot = true;
        const lastSeenKitchenQueuedTime = new Map();

        try {
            const q = query(collection(db, "orders"), where("status", "==", "open"));
            onSnapshot(q, snap => {
                const freshOrders = {};
                snap.forEach(d => {
                    const data = d.data();
                    const tId = Number(data.table_id || data.table_no);
                    freshOrders[tId] = { ...data, id: d.id, firestore_id: d.id, table_no: tId };
                });

                // İlk yüklemede geçmiş açık siparişlerin zaman damgalarını kaydet (Geçmiş için alarm çalma)
                if (isFirstKitchenSnapshot) {
                    snap.forEach(d => {
                        const data = d.data();
                        const tId = Number(data.table_id || data.table_no);
                        const queuedTime = Number(data.kitchen_queued_time || new Date(data.kitchen_queued_at || 0).getTime() || 0);
                        lastSeenKitchenQueuedTime.set(tId, queuedTime);
                    });
                    isFirstKitchenSnapshot = false;
                    activeOrders = freshOrders;
                    localStorage.setItem('cafe_cached_orders', JSON.stringify(activeOrders));
                    renderKitchen();
                    return;
                }

                // SADECE değişen veya yeni eklenen siparişleri incele (docChanges):
                snap.docChanges().forEach(change => {
                    if (change.type === 'added' || change.type === 'modified') {
                        const data = change.doc.data();
                        const tId = Number(data.table_id || data.table_no);
                        const isCompleted = data.kitchen_status === 'completed' || data.all_delivered === true;
                        const pendingItems = (data.items || []).filter(i => i && i.status !== 'delivered');

                        // Eğer siparişte hazırlanacak ürün yoksa veya mutfak tamamlandıysa ses çıkarma:
                        if (isCompleted || pendingItems.length === 0) return;

                        const queuedTime = Number(data.kitchen_queued_time || new Date(data.kitchen_queued_at || 0).getTime() || 0);
                        const prevQueued = lastSeenKitchenQueuedTime.get(tId) || 0;

                        // Garson YENİ bir sipariş veya ek sipariş gönderdiyse:
                        if (queuedTime > 0 && queuedTime > prevQueued) {
                            lastSeenKitchenQueuedTime.set(tId, queuedTime);
                            const isExtra = (data.items || []).some(i => i && i.status === 'delivered');

                            if (soundEnabled) {
                                playNotificationSound();
                                announceNewOrder(tId, pendingItems);
                            }
                            const orderTitle = isExtra ? `Masa ${tId} Ek Sipariş!` : `Yeni Sipariş: Masa ${tId}!`;
                            const orderBody = `${pendingItems.length} kalem: ${pendingItems.slice(0, 3).map(p => `${p.quantity}x ${p.name}`).join(', ')}`;
                            showToast(`🔔 ${orderTitle}`, "warning");
                            showSystemNotification(orderTitle, orderBody, `kds-${tId}-${queuedTime}`);
                            flashTabTitle(`🔔 (1) MASA ${tId} SİPARİŞ!`);
                        } else if (queuedTime > 0) {
                            lastSeenKitchenQueuedTime.set(tId, queuedTime);
                        }
                    } else if (change.type === 'removed') {
                        const data = change.doc.data();
                        const tId = Number(data.table_id || data.table_no);
                        lastSeenKitchenQueuedTime.delete(tId);
                    }
                });

                activeOrders = freshOrders;
                localStorage.setItem('cafe_cached_orders', JSON.stringify(activeOrders));
                renderKitchen();
            }, (err) => {
                console.error("Kitchen onSnapshot hatası:", err);
            });
        } catch(e) {}

        renderKitchen();
    </script>
